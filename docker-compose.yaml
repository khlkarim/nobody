services:
  db:
    image: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: nobody-db
      MYSQL_USER: nobody-user
      MYSQL_PASSWORD: nobody-password

    ports:
      - "3306:3306"

    volumes:
      - db_data:/var/lib/mysql

  adminer:
    image: adminer
    restart: unless-stopped

    ports:
      - "8080:8080"

    depends_on:
      - db

volumes:
  db_data:
